name: Build Plant Defense APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip python3-venv \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev automake gettext

      - name: Install Buildozer
        run: |
          python3 -m pip install --user \
            "Cython==0.29.36" \
            "buildozer==1.5.0"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate project configuration
        run: |
          set -eu
          test -f main.py
          test -f buildozer.spec
          test -f requirements.txt
          python3 -m py_compile main.py

          grep -q '^requirements = python3==3.11.5,kivy==2.3.1$' buildozer.spec

          if grep -Eiq 'charset[-_]normalizer|requests|certifi|urllib3|chardet|filetype|idna|six' requirements.txt; then
            echo "Unexpected third-party dependencies in requirements.txt"
            exit 1
          fi

          "$HOME/.local/bin/buildozer" --version
          echo "Configuration validation passed."

      - name: Build debug APK
        run: |
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: plant-defense-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
